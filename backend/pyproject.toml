[project]
name = "tornado-vpn-backend"
version = "2.1.0"
description = "Reliable HTTPS bootstrap API and Persian admin panel for Tornado VPN"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.40,<3",
  "psycopg[binary]>=3.2.9,<4",
  "alembic>=1.16,<2",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25.1,<26",
  "cryptography>=45,<47",
  "firebase-admin>=7,<8",
  "google-analytics-data>=0.18,<1",
  "redis>=6,<8",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "pillow>=11,<13",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "static/*.png", "static/fonts/*.woff2"]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
